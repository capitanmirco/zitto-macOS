name: macOS app

on:
  push:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: swift --version && sw_vers
      - name: Build
        run: swift build 2>&1 | tee build.log
      - name: Test
        run: swift test 2>&1 | tee test.log
      - name: App bundle
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zitto-app
          path: macos/build/zitto.app
