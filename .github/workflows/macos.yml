name: macOS

on:
  push:
    paths: ["macos/**", "zitto/**", "tests/**", "requirements*.txt", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "zitto/**", "tests/**", "requirements*.txt", ".github/workflows/macos.yml"]
  workflow_dispatch:

jobs:
  app:
    name: Swift app
    runs-on: macos-15
    defaults:
      run:
        shell: bash -eo pipefail {0}
        working-directory: macos
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: swift --version && sw_vers
      - name: Build
        run: swift build 2>&1 | tee build.log
      - name: Test
        run: swift test 2>&1 | tee test.log
      - name: App bundle
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v5
        with:
          name: zitto-app
          path: macos/build/zitto.app

  worker:
    # The Python that separates the songs, without the models: they are replaced in the tests.
    name: Python worker
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: brew install ffmpeg
      - name: Libraries
        run: python -m pip install numpy soundfile tinytag pytest
      - name: Test
        run: python -m pytest -rs
